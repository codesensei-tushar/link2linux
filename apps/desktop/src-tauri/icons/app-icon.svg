<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source for every app icon. Regenerate the PNG/ICNS/ICO set with `pnpm icons`. -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="96" y1="96" x2="928" y2="928">
      <stop offset="0" stop-color="#5B5BD6"/>
      <stop offset="1" stop-color="#0F9F8F"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Desktop monitor -->
    <rect x="384" y="268" width="448" height="344" rx="44" stroke-width="48"/>
    <path d="M608 612v92M520 724h176" stroke-width="48"/>
    <!-- Phone in front; the tile gradient fill hides the monitor behind it -->
    <rect x="192" y="388" width="232" height="396" rx="48" fill="url(#tile)" stroke-width="48"/>
    <path d="M280 712h56" stroke-width="36"/>
    <!-- Local network link -->
    <path d="M532 436c44-48 116-48 160 0" stroke-width="40"/>
    <path d="M574 488c20-22 56-22 76 0" stroke-width="40"/>
    <circle cx="612" cy="540" r="26" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
