[package]
name = "link2linux-desktop"
description = "link2linux desktop app: connect your Android phone to your Linux desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "link2linux-desktop"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "link2linux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64.workspace = true
# The clipboard through the window, on sessions that allow no other way.
# The same version Tauri builds on.
gtk = "=0.18.2"
tauri = { version = "2.12.5", features = [] }
# The native file chooser for "Send files", used from Rust only, so the
# webview never names the files to send.
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
link2linux-platform.workspace = true
link2linux-runtime.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
# Specta v2 is pre-release: tauri-specta asks for exact pins until it is stable.
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript", "derive"] }

[lints]
workspace = true
