[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Workspace crates.
link2linux-core = { path = "crates/core" }
link2linux-platform = { path = "crates/platform" }
link2linux-protocol = { path = "crates/protocol" }

# Wire format.
bytes = "1.12"
prost = "0.14.4"
prost-build = "0.14.4"

# Async runtime and I/O. Each crate enables only the tokio features it uses.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7.20", default-features = false, features = ["codec"] }

# Crypto, built on aws-lc-rs like the rest of the workspace, and encodings.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
zeroize = "1.8.2"

mdns-sd = { version = "0.21.6", default-features = false, features = ["async"] }
socket2 = { version = "0.6.5", features = ["all"] }

# Property tests.
proptest = "1.12"

# Errors and logging.
thiserror = "2.0.21"
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
