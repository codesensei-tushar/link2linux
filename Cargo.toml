[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Workspace crates.
link2linux-core = { path = "crates/core" }
link2linux-platform = { path = "crates/platform" }
link2linux-protocol = { path = "crates/protocol" }
link2linux-runtime = { path = "crates/runtime" }

# Wire format.
bytes = "1.12"
prost = "0.14.4"
prost-build = "0.14.4"

# Async runtime and I/O. Each crate enables only the tokio features it uses.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7.20", default-features = false, features = ["codec"] }

# Crypto, built on aws-lc-rs like the rest of the workspace, and encodings.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
zeroize = "1.8.2"

# TLS and the identity certificate, on the same aws-lc-rs; TLS 1.2 support
# is left out.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }

# The QR code URI and the pairing records file.
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

mdns-sd = { version = "0.21.6", default-features = false, features = ["async"] }
socket2 = { version = "0.6.5", features = ["all"] }
# Local interface addresses, for the on-link check before dialing.
if-addrs = "0.15.0"

# D-Bus, for the Linux platform integration. The tokio feature runs it on
# the tokio runtime and leaves async-io out.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# The Secret Service keyring, which holds the desktop's private key. It runs
# on the zbus above; the session with the keyring is encrypted with
# RustCrypto.
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
# Safe system calls, for prctl(PR_SET_DUMPABLE), and poll for the clipboard
# threads.
rustix = { version = "1.1.5", default-features = false, features = ["event", "process", "std"] }
# The clipboard: X11 selections (also through Xwayland), and Wayland
# data-control where the compositor offers it.
wl-clipboard-rs = { version = "0.9.4", default-features = false }
x11rb = { version = "0.14.0", default-features = false, features = ["xfixes"] }

# Tests.
proptest = "1.12"
tempfile = "3.27.0"

# Errors and logging.
thiserror = "2.0.21"
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
