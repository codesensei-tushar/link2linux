[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Workspace crates.
link2linux-protocol = { path = "crates/protocol" }

# Wire format.
prost = "0.14.4"
prost-build = "0.14.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
