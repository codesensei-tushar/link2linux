[package]
name = "link2linux-platform"
description = "Desktop OS integration for link2linux behind traits, with a Linux implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
oo7.workspace = true
rustix.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
wl-clipboard-rs.workspace = true
x11rb.workspace = true
zbus.workspace = true

[dev-dependencies]
# Peer-to-peer connections let the tests stand in for BlueZ without a bus.
zbus = { workspace = true, features = ["p2p"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util", "time"] }
