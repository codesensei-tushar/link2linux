name: Release

# Builds every download when a version tag such as v0.1.0 is pushed, and
# collects them in a draft GitHub release for a maintainer to publish.
# Started by hand from the Actions tab instead, it is a build-only run: the
# same files, signed, become a "release-files" workflow artifact and no
# release is created, which tests the pipeline before tagging.
# docs/releasing.md has the full checklist. The asset names are fixed: the
# website and install.sh look files up by name.
# Every action is pinned to a full commit SHA, with its release in a comment,
# so a moved tag cannot change what runs next to the signing key; update the
# SHA and the comment together.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    # The oldest supported runners, so the binaries also run on
    # distributions with an older glibc. Each architecture builds on its own
    # machine: no cross-compiling.
    strategy:
      matrix:
        include:
          - arch: x86_64
            deb: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            deb: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tag matches the workspace and frontend versions
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$v\"" Cargo.toml ||
            { echo "::error::Cargo.toml [workspace.package] version is not $v"; exit 1; }
          grep -q "\"version\": \"$v\"" apps/desktop/package.json ||
            { echo "::error::apps/desktop/package.json version is not $v"; exit 1; }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev protobuf-compiler libfuse2
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          # The Arm runners may come without rustup.
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop tauri build
      - name: Give the bundles their published names
        run: |
          b=target/release/bundle
          mkdir dist
          cp $b/deb/*_${{ matrix.deb }}.deb dist/link2linux_${{ matrix.deb }}.deb
          cp $b/rpm/*.${{ matrix.arch }}.rpm dist/link2linux.${{ matrix.arch }}.rpm
          cp $b/appimage/*.AppImage dist/link2linux-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # The Flatpak wraps the .deb built above, so it runs the same binary. The
  # container has flatpak-builder and the GNOME runtime that the manifest
  # names; keep its tag and the manifest's runtime-version the same.
  flatpak:
    needs: desktop
    strategy:
      matrix:
        include:
          - arch: x86_64
            deb: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            deb: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      # gnome-49
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:8a05aca51163a81259cc011302cc5121779c89b8b16f2819cc3fd06817d136e7
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-desktop-${{ matrix.arch }}
          path: desktop
      - name: Build the Flatpak
        run: |
          m=apps/desktop/packaging/flatpak
          cp desktop/link2linux_${{ matrix.deb }}.deb $m/link2linux.deb
          opts="--disable-rofiles-fuse --default-branch=stable --arch=${{ matrix.arch }}"
          flatpak-builder $opts --build-only --force-clean --install-deps-from=flathub \
            build $m/dev.link2linux.desktop.yml
          # The runtime must have every library the binary links: a missing
          # one would only show when someone starts the app. Running inside
          # the build needs a machine id, which the container lacks.
          [ -s /etc/machine-id ] || tr -d - < /proc/sys/kernel/random/uuid > /etc/machine-id
          flatpak-builder --disable-rofiles-fuse --run build $m/dev.link2linux.desktop.yml \
            ldd /app/bin/link2linux-desktop > libs.txt
          cat libs.txt
          ! grep 'not found' libs.txt ||
            { echo "::error::The runtime lacks libraries the app links"; exit 1; }
          flatpak-builder $opts --finish-only --repo=repo build $m/dev.link2linux.desktop.yml
          mkdir dist
          flatpak build-bundle --arch=${{ matrix.arch }} \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo dist/link2linux.${{ matrix.arch }}.flatpak dev.link2linux.desktop stable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tag matches the app's versionName
        if: github.ref_type == 'tag'
        run: |
          grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" apps/android/app/build.gradle.kts ||
            { echo "::error::apps/android/app/build.gradle.kts versionName is not ${GITHUB_REF_NAME#v}"; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build the release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  # Signed in a job of its own, rather than in Gradle or after it in the
  # build job, so the key never shares a machine with the build: the Gradle
  # daemon and anything a plugin or dependency starts outlive the build step,
  # run as the same user, and could otherwise read the keystore or this
  # step's environment. Only the runner's own Android SDK tools run here.
  android-sign:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] ||
            { echo "::error::The ANDROID_KEYSTORE_* secrets are not set; see docs/releasing.md"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/release.jks"
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks")
          # keytool makes PKCS12 keystores, which protect the key with the
          # keystore password; only an older JKS keystore may need its own.
          key_pass=env:KEYSTORE_PASSWORD
          [ -z "$KEY_PASSWORD" ] || key_pass=env:KEY_PASSWORD
          mkdir dist
          # -P 16 aligns native libraries for 16 KB memory pages.
          "$bt/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass "$key_pass" \
            --out dist/link2linux.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$ks"
          "$bt/apksigner" verify --print-certs dist/link2linux.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/link2linux.apk
          if-no-files-found: error

  publish:
    needs: [desktop, flatpak, android-sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # For CHANGELOG.md and the release notes template.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only the finished files: not the unsigned APK.
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum link2linux* | tee SHA256SUMS
      - name: Keep the files of a build-only run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/link2linux*
      # The version's CHANGELOG.md section, then the install instructions,
      # then GitHub's list of the merged pull requests.
      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/ { keep = index($0, "## [" v "]") == 1; next } keep && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md ||
            { echo "::error::CHANGELOG.md has no section for $v; see docs/releasing.md"; exit 1; }
          sed "s/{{VERSION}}/$v/g" .github/release-notes.md >> notes.md
      # A draft, so a maintainer checks it before anyone can download it.
      # Versions before 1.0 are marked as pre-releases.
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft $prerelease --notes-file notes.md --generate-notes \
            --title "link2linux ${GITHUB_REF_NAME#v}"
