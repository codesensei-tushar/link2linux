name: CI

# Manual only: checks run locally with `make ci` before merging, which saves
# runner time. Trigger this from the Actions tab when a remote run is wanted.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides which jobs run: a job runs when its paths changed (always on
  # push to main) and its project exists in the tree yet.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      proto: ${{ github.event_name != 'pull_request' || steps.filter.outputs.proto == 'true' }}
      rust: ${{ steps.exists.outputs.rust == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true') }}
      desktop-web: ${{ steps.exists.outputs.desktop-web == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.desktop-web == 'true') }}
      android: ${{ steps.exists.outputs.android == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.android == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'buf.yaml'
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'proto/**'
            desktop-web:
              - 'apps/desktop/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            android:
              - 'apps/android/**'
              - 'proto/**'
      - name: Which projects exist
        id: exists
        run: |
          has() { compgen -G "$1" > /dev/null && echo true || echo false; }
          rust=false
          if [ "$(has 'crates/*/Cargo.toml')" = true ] || [ "$(has 'apps/*/src-tauri/Cargo.toml')" = true ]; then
            rust=true
          fi
          desktop_web=false
          if [ -f apps/desktop/package.json ] && [ -f pnpm-lock.yaml ]; then
            desktop_web=true
          fi
          {
            echo "rust=$rust"
            echo "desktop-web=$desktop_web"
            echo "android=$(has apps/android/gradlew)"
          } | tee -a "$GITHUB_OUTPUT"

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          lint: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main"
          push: false
          # Results show in the job summary; posting PR comments needs write access.
          pr_comment: false

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev protobuf-compiler
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Use --locked when Cargo.lock is committed
        run: |
          if [ -f Cargo.lock ]; then echo "LOCKED=--locked" >> "$GITHUB_ENV"; fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets $LOCKED -- -D warnings
      - run: cargo test --workspace $LOCKED
      - name: Generated TypeScript bindings are up to date
        if: hashFiles('apps/desktop/src/lib/bindings.ts') != ''
        run: git diff --exit-code -- apps/desktop/src/lib/bindings.ts

  desktop-web:
    needs: changes
    if: needs.changes.outputs.desktop-web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No version input: the pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop lint
      - run: pnpm --filter desktop typecheck
      - run: pnpm --filter desktop test

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew assembleDebug testDebugUnitTest lint

  # The one check to mark as required in branch protection. Skipped jobs
  # count as passing; failed or cancelled ones do not.
  ci-ok:
    needs: [changes, proto, rust, desktop-web, android]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All relevant jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          test "$FAILED" = false
